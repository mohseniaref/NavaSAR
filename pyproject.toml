[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navasar"
version = "0.1.0a1"
description = "Physics-based SAR and InSAR modeling, simulation, polarimetry, and retrieval"
readme = "README.md"
authors = [
    { name = "Mohammad Mohseni Aref" }
]
license = { text = "MIT" }
keywords = [
    "SAR",
    "InSAR",
    "soil moisture",
    "closure phase",
    "dielectric constant",
    "microwave remote sensing",
    "geophysics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0"
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "notebook>=6.4.0"
]
test = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/mohseniaref/NavaSAR"
Repository = "https://github.com/mohseniaref/NavaSAR.git"
Documentation = "https://github.com/mohseniaref/NavaSAR/tree/main/docs"

[tool.setuptools]
packages = ["navasar"]
